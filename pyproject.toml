[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sword-excel"
dynamic = ["version"]
description = "Sword: limpia y une archivos Excel en segundos."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Heric Solorzano" }]
maintainers = [{ name = "Heric Solorzano" }]
keywords = [
    "excel",
    "pandas",
    "automatizacion",
    "data-cleaning",
    "csv",
    "xlsx",
    "cli",
    "productividad",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Utilities",
]
dependencies = [
    "pandas>=1.5",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "rich>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "mypy>=1.8",
]

[project.urls]
Homepage = "https://github.com/hericsolorzano-beep/Sword"
Repository = "https://github.com/hericsolorzano-beep/Sword"
Issues = "https://github.com/hericsolorzano-beep/Sword/issues"
Changelog = "https://github.com/hericsolorzano-beep/Sword/blob/main/CHANGELOG.md"

[project.scripts]
sword = "sword.cli:main"

[tool.setuptools]
packages = ["sword"]

[tool.setuptools.dynamic]
version = { attr = "sword.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=sword --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
branch = true
source = ["sword"]
omit = [
    # `__main__.py` existe solo para permitir `python -m sword`. Se verifica de
    # verdad con pruebas que lanzan un subproceso, pero la cobertura no mide
    # dentro de otros procesos, así que aquí solo contaría como línea perdida.
    "sword/__main__.py",
]

[tool.coverage.report]
show_missing = true
# `exclude_also` y no `exclude_lines`: la segunda clave REEMPLAZA las
# exclusiones propias de coverage.py en vez de añadirse a ellas.
exclude_also = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise SystemExit",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RET", "ARG", "C4", "PTH"]
ignore = [
    "E501",   # el ancho lo controla el formateador, no el linter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002", "SIM117"]  # fixtures y helpers de test

[tool.mypy]
python_version = "3.10"
files = ["sword"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["pandas.*", "rich.*", "xlrd.*"]
ignore_missing_imports = true
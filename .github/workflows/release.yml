name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # `binary_name` debe ser ÚNICO por plataforma: GitHub publica los
          # adjuntos por su nombre base, así que dos binarios llamados "Sword"
          # (macOS y Linux) se pisarían y el release acabaría con menos
          # archivos de los previstos.
          - name: Windows
            os: windows-latest
            binary_name: Sword.exe
            artifact: Sword-windows
          - name: macOS
            os: macos-latest
            binary_name: Sword-macos
            artifact: Sword-macos
          - name: Linux
            os: ubuntu-latest
            binary_name: Sword-linux
            artifact: Sword-linux

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar Sword y PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps
          pip install pyinstaller

      - name: Compilar ejecutable
        run: pyinstaller --onefile --name ${{ matrix.binary_name }} --console sword/cli.py

      - name: Comprobar que el binario arranca
        shell: bash
        run: |
          chmod +x dist/* || true
          # `--version` es inocuo: valida que el arranque y las dependencias
          # empaquetadas funcionan sin tocar datos del usuario.
          ./dist/${{ matrix.binary_name }} --version

      - name: Subir ejecutable como artefacto
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.binary_name }}

  publicar:
    name: Publicar en GitHub Releases
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: binarios
          merge-multiple: true

      - name: Comprobar que llegaron los tres binarios
        run: |
          ls -la binarios
          for esperado in Sword.exe Sword-macos Sword-linux; do
            test -f "binarios/$esperado" || {
              echo "::error::falta el binario $esperado en el release"
              exit 1
            }
          done

      # Nota: `generate_release_notes` solo se aplica si `body` viene vacío, así
      # que aquí se usa únicamente el body escrito a mano.
      - name: Publicar los tres binarios
        uses: softprops/action-gh-release@v2
        with:
          files: binarios/*
          body: |
            ## Sword ${{ github.ref_name }}

            | Sistema | Archivo | Cómo usarlo |
            |---|---|---|
            | Windows | `Sword.exe` | doble clic, o `Sword.exe CARPETA` |
            | macOS | `Sword-macos` | `chmod +x Sword-macos` y luego `./Sword-macos CARPETA` |
            | Linux | `Sword-linux` | `chmod +x Sword-linux` y luego `./Sword-linux CARPETA` |

            Los tres se compilan y se prueban en la CI antes de publicarse.
            Ejemplo:

            ```
            Sword.exe C:\Usuarios\TuNombre\Escritorio\mis_excels
            ```

            Sword también se puede usar como librería desde Python. Los detalles
            de esta versión están en el
            [CHANGELOG](https://github.com/hericsolorzano-beep/Sword/blob/main/CHANGELOG.md).

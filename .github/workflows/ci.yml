name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  calidad:
    name: Lint y tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Formato y estilo (ruff)
        run: ruff check --output-format=github .

      - name: Tipos (mypy)
        run: mypy

  pruebas:
    name: Py${{ matrix.python-version }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python puro, así que se prueban las cuatro versiones declaradas
          # (3.10 a 3.13) en Linux y Windows, y las dos últimas en macOS, cuyo
          # runner es el más caro. Cubrir el rango completo es lo que hace
          # verdadera la promesa del README.
          - { os: ubuntu-latest,  python-version: "3.10" }
          - { os: ubuntu-latest,  python-version: "3.11" }
          - { os: ubuntu-latest,  python-version: "3.12" }
          - { os: ubuntu-latest,  python-version: "3.13" }
          - { os: windows-latest, python-version: "3.10" }
          - { os: windows-latest, python-version: "3.11" }
          - { os: windows-latest, python-version: "3.12" }
          - { os: windows-latest, python-version: "3.13" }
          - { os: macos-latest,   python-version: "3.12" }
          - { os: macos-latest,   python-version: "3.13" }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar el paquete y sus dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e . --no-deps

      - name: Ejecutar pruebas
        # `--cov-fail-under` se aplica en cada job: una regresión de cobertura
        # debe verse en el pull request, no months después.
        run: pytest --cov-fail-under=85 -v

      - name: Subir cobertura
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage.xml
          if-no-files-found: ignore

  smoke:
    name: El comando instalado funciona
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar Sword
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e . --no-deps

      # Verifica el punto de entrada que de verdad usa el cliente: el comando
      # `sword` instalado, no sólo `python -m sword`.
      - name: Ejecutar sword sobre los datos de ejemplo
        run: |
          sword --version
          sword datos_prueba -o /tmp/demo.xlsx
          python -c "import pandas as pd; d=pd.read_excel('/tmp/demo.xlsx'); assert len(d)>0, 'salida vacía'; print(d)"

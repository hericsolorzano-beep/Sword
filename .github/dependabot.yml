version: 2

updates:
  # Dependencias de ejecución: patch y minor. Las majors se revisan a mano
  # porque pandas 3.x cambió comportamiento y una major 4 traería otra.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      python-minor:
        update-types: ["minor", "patch"]

  # Acciones de GitHub: se mantiene todo al día (dependencias transitivas).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: ["dependencies", "github-actions"]
    ignore:
      # Estas dos solo se ejecutan en el job `publicar`, que solo corre al
      # publicar un tag. La CI no las ejercita, así que subirlas sin poder
      # probarlas dejaría el release en manos de un cambio a ciegas. Se
      # actualizan a mano publicando un tag de prueba.
      - dependency-name: softprops/action-gh-release
        update-types: ["version-update:semver-major"]
      - dependency-name: actions/download-artifact
        update-types: ["version-update:semver-major"]
